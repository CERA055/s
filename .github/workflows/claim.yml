name: soliumbra-claim

on:
  schedule:
    # 千万别用 :00~:05！GitHub 官方文档明确说「每小时整点是高负载时段，
    # 定时任务会被延迟甚至丢弃」。
    # 第一版用 "3 * * * *"，结果 11 小时只漏出 1 次运行（08:57 才被调度）。
    # 现在错峰到 :17 和 :47 双份冗余。实测整点后整小时都能领，不必卡整点。
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      kinds:
        description: "要领取的类型，空格分隔（daily hourly）"
        required: false
        default: "hourly daily"

concurrency:
  group: claim
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai        # 日志时间按北京时间显示
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: pip install --quiet requests

      - name: hourly
        continue-on-error: true
        env:
          SOLIUMBRA_COOKIE: ${{ secrets.SOLIUMBRA_COOKIE }}
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
          YESCAPTCHA_KEY: ${{ secrets.YESCAPTCHA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python soliumbra_claim.py --kind hourly --notify --quiet-ok

      - name: daily
        continue-on-error: true
        env:
          SOLIUMBRA_COOKIE: ${{ secrets.SOLIUMBRA_COOKIE }}
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
          YESCAPTCHA_KEY: ${{ secrets.YESCAPTCHA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python soliumbra_claim.py --kind daily --notify --quiet-ok

      # 401 说明 cookie 过期，用 action 失败提醒你（GitHub 会给你发邮件）
      - name: cookie 有效性
        env:
          SOLIUMBRA_COOKIE: ${{ secrets.SOLIUMBRA_COOKIE }}
        run: python soliumbra_claim.py --check
