name: soliumbra-claim

on:
  schedule:
    # 这个 cron 现在只当「唤醒信号」。真正干活的是 daemon.py：
    # 每次唤醒连续跑 5.5 小时，自己按整点领。
    # 所以 cron 丢多少次都不致命 —— 只要 5.5 小时内成功唤醒一次就能续上。
    # 实测 "3 * * * *" 在这种仓库上 11 小时只触发 1 次，所以选了非整点的 :07。
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  # 同一时间只跑一个。新触发的会排队，等当前那个跑完（5.5h）立刻接手。
  group: claim
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # GitHub 单个 job 上限 6 小时，留 10 分钟余量
    timeout-minutes: 350
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: pip install --quiet requests

      - name: daemon
        env:
          SOLIUMBRA_COOKIE: ${{ secrets.SOLIUMBRA_COOKIE }}
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
          YESCAPTCHA_KEY: ${{ secrets.YESCAPTCHA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daemon.py --hours 5.5
