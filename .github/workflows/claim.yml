name: s

# 云端领取实验：用 xvfb 虚拟显示跑有头 Chrome，走和本地 gui_claim 一样的路径
# （点页面按钮 → CF 给交互式验证 → 点 iframe 复选框）。
# 如果这条能通，电脑关机也能领，且零成本。

on:
  schedule:
    # 每天 09:13 北京时间做 cookie 健康探针
    - cron: "13 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 只查 cookie；claim = 用 xvfb 浏览器领一次"
        required: false
        default: "check"

jobs:
  check:
    if: github.event.inputs.mode != 'claim'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: cookie 有效性
        env:
          S_COOKIE: ${{ secrets.S_COOKIE }}
        run: python s_claim.py --check

  claim-gui:
    if: github.event.inputs.mode == 'claim'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装 xvfb 和依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-noto-cjk
          pip install --quiet patchright requests

      - name: 系统 Chrome 版本
        run: google-chrome --version || chromium --version || echo "没有系统 chrome"

      - name: 用虚拟显示跑有头浏览器领取
        env:
          S_COOKIE: ${{ secrets.S_COOKIE }}
        run: |
          xvfb-run -a --server-args="-screen 0 1600x900x24" \
            python gui_claim.py --kind hourly --wait 45 || echo "gui_claim 退出码 $?"

      - name: 上传失败截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-shots
          path: |
            gui_*.png
            gui.log
          if-no-files-found: ignore
