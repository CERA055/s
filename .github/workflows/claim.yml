name: s

# 云端只做 cookie 健康探针，不再负责领取。
#
# 为什么：
#   1. GitHub 的 schedule 在这个仓库上实测极不可靠（11 小时只触发 1 次，
#      长跑 daemon 结束后排队的 cron 也全部没有接上）。
#   2. 领取已经交给本地的 gui_claim.py（真实浏览器点按钮 + 点 Turnstile 复选框），
#      云端再跑一份只会和本地争名额，互相返回「已经领过」。
#   3. 但云端有个本地替代不了的能力：job 失败会发邮件到邮箱。
#      cookie 过期时这是最省心的告警，所以每天探一次。
#
# 想临时手动领一次：Actions → Run workflow（会执行一次 --check，仅查看状态）。

on:
  schedule:
    # 每天 09:13 北京时间。避开整点（GitHub 整点高负载会丢任务）。
    - cron: "13 1 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: pip install --quiet requests

      - name: cookie 有效性
        env:
          S_COOKIE: ${{ secrets.S_COOKIE }}
        # 退出码 2 = cookie 失效 → 这个 step 红 → GitHub 发邮件提醒
        run: python s_claim.py --check
